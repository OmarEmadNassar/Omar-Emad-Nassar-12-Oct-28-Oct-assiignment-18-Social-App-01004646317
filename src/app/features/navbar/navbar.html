<nav class="bg-neutral-primary fixed w-full z-20 top-0 start-0 border-b border-default">
  <div class="max-w-screen-xl mx-auto grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-1 p-2">
    <a routerLink="/feeds" class="flex items-center gap-1">
      <img src="/Images/route.png" class="h-9 w-9 rounded-xl object-cover" alt="Route Logo" />
      <span class="hidden sm:block self-center text-xl text-heading font-semibold whitespace-nowrap"
        >Route Posts</span
      >
    </a>
    <div class="relative col-start-3 row-start-1 flex items-center justify-end">
      <button
        type="button"
        class="cursor-pointer flex items-center text-sm border border-gray rounded-full md:me-0 hover:bg-gray-100"
        id="user-menu-button"
        aria-expanded="false"
        aria-haspopup="true"
        data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom-end"
      >
        <span class="sr-only">Open user menu</span>
        <img
          class="w-8 h-8 rounded-full m-1"
          [src]="accountOwner().photo"
          [alt]="accountOwner().name + ' profile photo'"
        />
        <span class="hidden sm:block text-gray-600 font-serif m-auto mr-2">{{ accountOwner().name }}</span>
        <i class="hidden sm:block fa-solid  m-auto px-1 mx-2 fa-bars mr-2" style="color: #acafb9"></i>
      </button>
      <!-- Dropdown menu -->
      <div
        class="z-50 hidden bg-neutral-primary-medium border border-default-medium rounded-base shadow-lg w-44"
        id="user-dropdown"
      >
        <ul class="p-2 text-sm text-body font-medium" aria-labelledby="user-menu-button">
          <li>
            <a
              routerLink="/profile"
              class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
              ><i class="fa-regular fa-user mx-1" style="color: rgb(95, 98, 109);"></i>
              Profile</a
            >
          </li>
          <li>
            <a
              routerLink="/setting"
              class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded"
              ><i class="fa-solid fa-gear mx-1" style="color: rgb(95, 98, 109);"></i>Settings</a
            >
          </li>
          <li>
            <a
              routerLink="#"
              (click)="navvbarLogout()"
              class="inline-flex items-center w-full p-2 text-rose-500 hover:bg-rose-100  rounded"
              >Logout</a
            >
          </li>
        </ul>
      </div>
    </div>
    <div
      class="col-start-2 row-start-1   flex min-w-0 items-center justify-center"
    >
      <ul
        class="border-2 rounded-xl border-gray-200 flex min-w-0 items-center justify-center gap-1 sm:gap-3 font-medium"
      >
        <li>
          <a
            routerLink="/feeds"
            routerLinkActive="text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
            #feedLink="routerLinkActive"
            ariaCurrentWhen="page"
            [class.hover:text-black]="!feedLink.isActive"
            [class.text-gray-700]="!feedLink.isActive"
            class="block whitespace-nowrap rounded px-1 py-2 text-xs font-bold transition-colors sm:px-2 sm:text-sm"
            ><i class="fa-regular fa-house mx-1 fa-lg"></i>Feed</a
          >
        </li>
        <li>
          <a
            routerLink="/profile"
            routerLinkActive="text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
            #profileLink="routerLinkActive"
            ariaCurrentWhen="page"
            [class.hover:text-black]="!profileLink.isActive"
            [class.text-gray-700]="!profileLink.isActive"
            class="block whitespace-nowrap rounded px-1 py-2 text-xs font-bold transition-colors sm:px-2 sm:text-sm"
            ><i class="fa-regular fa-user mx-1 fa-lg"></i>Profile</a
          >
        </li>
        <li>
          <a
            routerLink="/notification"
            routerLinkActive="text-blue-700"
            [routerLinkActiveOptions]="{ exact: true }"
            #notificationLink="routerLinkActive"
            ariaCurrentWhen="page"
            [class.hover:text-black]="!notificationLink.isActive"
            [class.text-gray-700]="!notificationLink.isActive"
            class="block whitespace-nowrap rounded px-1 py-2 text-xs font-bold transition-colors sm:px-2 sm:text-sm"
            ><i class="fa-regular fa-comment mx-1 fa-lg"></i> Notifications</a
          >
        </li>
      </ul>
    </div>
  </div>
</nav>
