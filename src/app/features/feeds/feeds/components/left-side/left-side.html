  <!-- LEFT -->
  <aside class="w-full lg:fixed lg:w-1/6 lg:top-20 lg:self-start">
    <nav class="grid grid-cols-2 gap-1.5 rounded-[20px] border border-[#edf0f5] bg-white p-3.5 shadow-[0_2px_10px_rgba(15,23,42,0.06)] lg:flex lg:flex-col">
      <a
        routerLink="/feeds"
        routerLinkActive="text-blue-700"
        [routerLinkActiveOptions]="{ exact: true }"
        #feedLink="routerLinkActive"
        ariaCurrentWhen="page"
        [class.hover:text-black]="!feedLink.isActive"
        [class.text-gray-700]="!feedLink.isActive"
        [class.bg-blue-100]="feedLink.isActive"
        [class.hover:bg-gray-100]="!feedLink.isActive"
        class="flex cursor-pointer items-center gap-2.5 rounded-full px-3 py-2 text-[12px] font-bold hover:bg-gray-100 md:me-0"
      >
        <i class="fa-regular fa-newspaper w-6 text-center fa-lg"></i> Feed
      </a>
      <a
        routerLink="/myPosts"
        routerLinkActive="text-blue-700"
        [routerLinkActiveOptions]="{ exact: true }"
        #myPostsLink="routerLinkActive"
        ariaCurrentWhen="page"
        [class.hover:text-black]="!myPostsLink.isActive"
        [class.text-gray-700]="!myPostsLink.isActive"
        [class.bg-blue-100]="myPostsLink.isActive"
        [class.hover:bg-gray-100]="!myPostsLink.isActive"

        class="flex cursor-pointer items-center gap-2.5 rounded-full px-3 py-2 text-[12px] font-bold hover:bg-gray-100 md:me-0"
      >
        <i class="fa-solid fa-wand-magic-sparkles w-6 text-center fa-lg"></i> My Posts
      </a>
      <a
        routerLink="/community"
        routerLinkActive="text-blue-700"
        [routerLinkActiveOptions]="{ exact: true }"
        #communityLink="routerLinkActive"
        ariaCurrentWhen="page"
        [class.hover:text-black]="!communityLink.isActive"
        [class.text-gray-700]="!communityLink.isActive"
        [class.bg-blue-100]="communityLink.isActive"
        [class.hover:bg-gray-100]="!communityLink.isActive"

        class="flex cursor-pointer items-center gap-2.5 rounded-full px-3 py-2 text-[12px] font-bold hover:bg-gray-100 md:me-0"
      >
        <i class="fa-regular fa-compass w-6 text-center fa-lg"></i> Community
      </a>
      <a
        routerLink="/saved"
        routerLinkActive="text-blue-700"
        [routerLinkActiveOptions]="{ exact: true }"
        #savedLink="routerLinkActive"
        ariaCurrentWhen="page"
        [class.hover:text-black]="!savedLink.isActive"
        [class.text-gray-700]="!savedLink.isActive"
        [class.bg-blue-100]="savedLink.isActive"
        [class.hover:bg-gray-100]="!savedLink.isActive"

        class="flex cursor-pointer items-center gap-2.5 rounded-full px-3 py-2 text-[12px] font-bold hover:bg-gray-100 md:me-0"
      >
        <i class="fa-regular fa-bookmark w-6 text-center fa-lg"></i> Saved
      </a>
    </nav>
  </aside>
