<form
  (submit)="submitPost($event, postTextarea, mediaInput)"
  class="block rounded-[20px] border border-[#edf0f5] bg-white px-5 pb-[18px] pt-5 shadow-[0_2px_10px_rgba(15,23,42,0.06)]"
>
  <div class="mb-3.5 flex items-center gap-3.5">
    <img
      class="h-14 w-14 rounded-full object-cover"
      [src]="accountOwner().photo"
      [alt]="accountOwner().name"
    />
    <div>
      <h4 class="mb-1.5 text-base font-extrabold">{{ accountOwner().name }}</h4>
      <div
        class="mt-1 inline-flex items-center gap-2 rounded-full border border-slate-200 bg-slate-100 px-1 text-xs font-semibold text-slate-700"
      >
        <i class="fa-solid fa-earth-americas px-1" aria-hidden="true"></i>
        <select
          #audienceSelect
          aria-label="Post audience"
          [formControl]="postPrivacy"
          class="rounded-full border-0 bg-transparent pl-0 px-7 py-0 text-xs font-semibold text-slate-700 focus:ring-0"
        >
          <option value="public">Public</option>
          <option value="following">Followers</option>
          <option value="only_me">Only me</option>
        </select>
      </div>
    </div>
  </div>

  <textarea
    #postTextarea
    class="h-20 w-full resize-y rounded-[18px] border border-slate-200 bg-slate-50 px-5 py-[17px] text-lg outline-none placeholder:text-slate-400"
    [placeholder]="postPlaceholder()"
    [value]="postText()"
    (input)="updatePostText($event)"
    aria-label="Write a post"
  ></textarea>
  @if (selectedMedia(); as media) {
    <div class="mt-3 overflow-hidden rounded-xl border border-slate-200 bg-slate-50">
      <div class="group relative">
        @if (selectedMediaPreview(); as previewUrl) {
          <img
            #imgPreview
            [src]="previewUrl"
            [alt]="'Preview of ' + media.name"
            class="max-h-60 w-full object-cover"
          />
        }
        <button
          type="button"
          class="absolute right-3 top-3 inline-flex h-9 w-9 cursor-pointer items-center justify-center rounded-full bg-black/60 text-white opacity-0 shadow transition duration-200 hover:bg-red-600 focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white group-hover:opacity-100"
          aria-label="Remove selected photo"
          (click)="clearSelectedMedia(mediaInput)"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  }
  @if (mediaError()) {
    <p class="mt-2 text-sm text-red-600" role="alert">{{ mediaError() }}</p>
  }
  <div class="mt-[22px] flex items-center justify-between border-t-[1.5px] border-slate-800 pt-3.5">
    <div class="flex gap-2">
      <label
        class="inline-flex cursor-pointer items-center gap-2.5 rounded-lg px-3.5 py-2.5 text-sm text-slate-700 transition hover:bg-slate-200"
      >
        <input
          #mediaInput
          type="file"
          class="sr-only"
          accept="image/*"
          aria-label="Choose a photo"
          (change)="onMediaSelected($event)"
        />
        <i class="fa-regular fa-image text-[20px] text-green-600" aria-hidden="true"></i>
        Photo
      </label>
      <div class="relative">
        <button
          #feelingButton
          type="button"
          class="inline-flex cursor-pointer items-center gap-2.5 rounded-lg px-3.5 py-2.5 text-sm text-slate-700 transition hover:bg-slate-200"
          aria-haspopup="true"
          [attr.aria-expanded]="showFeelingOptions()"
          (click)="toggleEmojiPicker(postTextarea)"
          (pointerenter)="preloadEmojiPicker()"
          (focus)="preloadEmojiPicker()"
        >
          <i class="fa-regular fa-face-smile text-[20px] text-amber-500" aria-hidden="true"></i>
          <span>{{ selectedFeeling() || 'Feeling/activity' }}</span>
        </button>
        <div
          class="emoji-picker-popup absolute bottom-full left-0 z-20 mb-2 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-lg"
          aria-label="Choose an emoji"
          [hidden]="!showFeelingOptions()"
        >
          <div #emojiPickerHost></div>
        </div>
      </div>
    </div>
    <button
      type="submit"
      class="inline-flex min-w-24 cursor-pointer items-center justify-center gap-2 rounded bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-blue-300 disabled:opacity-70"
      [disabled]="isPosting()"
    >
      @if (isPosting()) {
        Posting...
      } @else {
        Post <i class="fa-regular fa-paper-plane" aria-hidden="true"></i>
      }
    </button>
  </div>

  @if (postError()) {
    <p class="mt-2 text-sm text-red-600" role="alert">{{ postError() }}</p>
  }
  @if (postSuccess()) {
    <p class="mt-2 text-sm text-green-700" role="status">{{ postSuccess() }}</p>
  }
  @if (emojiPickerError()) {
    <p class="mt-2 text-sm text-red-600" role="alert">{{ emojiPickerError() }}</p>
  }
</form>
